# ============================================================================
# 手動管理設定（自動生成対象外）
# ============================================================================

Host *
  ServerAliveInterval 60
  ServerAliveCountMax 3
  TCPKeepAlive yes
  ControlMaster auto
  ControlPath ~/.ssh/cp-%C
  ControlPersist 10m
  HashKnownHosts yes
  HostKeyAlgorithms ssh-ed25519,ssh-rsa
  UseKeychain no
  AddKeysToAgent no
  IdentitiesOnly yes

# ローカル管理端末
Host MACMDEVC07FK2DZQ6P0
  HostName 100.125.78.9
